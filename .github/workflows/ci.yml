name: CI

# Corre en cada cambio a la rama principal y en cada pull request. No usa ningún secreto: las
# pruebas de base de datos corren contra un Postgres en memoria, nunca contra Supabase.
on:
  push:
    branches: [claude/google-docs-link-review-19lx7g, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 es la LTS vigente (la 26 todavía es «Current»).
          node-version: 24
          cache: npm

      - run: npm ci

      # Falla si una dependencia que llega a producción tiene una vulnerabilidad alta o crítica.
      # (Las de herramientas de desarrollo, como el lint, no llegan al sitio y no cortan el CI.)
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de la base de datos (RLS, reservas)
        run: npm run test:db

      - name: Build
        run: npm run build

  # El recorrido completo en un navegador contra un Supabase local (e2e/README.md). Tampoco usa secretos: las
  # claves son las de demo del Supabase local.
  punta-a-punta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Supabase local
        run: npm run e2e:supabase

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Recorrido de punta a punta
        run: npm run e2e

      - name: Informe del recorrido
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recorrido-punta-a-punta
          path: |
            playwright-report/
            test-results/
          retention-days: 7
